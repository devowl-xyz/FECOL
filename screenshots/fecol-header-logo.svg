<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64">
  <rect width="280" height="64" fill="#111114"/>
  <!-- Logo box -->
  <rect x="20" y="14" width="36" height="36" rx="8" fill="#FFE500"/>
  <!-- Drop shadow line -->
  <rect x="22" y="48" width="36" height="2" rx="1" fill="rgba(0,0,0,0.4)"/>
  <!-- F/ text inside box -->
  <text x="38" y="34" font-family="Arial Black, Arial" font-weight="900" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">F/</text>
  <!-- FECOL wordmark -->
  <text x="68" y="32" font-family="Arial Black, Arial" font-weight="900" font-size="20" fill="#f0f0e8" text-anchor="start" dominant-baseline="middle" letter-spacing="2">FECOL</text>
</svg>
